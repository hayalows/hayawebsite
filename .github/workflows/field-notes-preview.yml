name: Field Notes design verification
on:
  push:
    branches: ['design/field-notes-layout-overhaul', 'design/field-notes-components-wip']
  pull_request:
    branches: [main]
    paths: ['cv/portfolio-field-notes/**', 'cv/THIRD-PARTY-NOTICES.md', '.github/workflows/field-notes-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright
      - name: Select browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_BROWSER=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: node cv/portfolio-field-notes/verify.mjs
      - name: Browser verification
        run: node cv/portfolio-field-notes/preview-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-notes-preview
          path: /tmp/fieldnotes-preview/
