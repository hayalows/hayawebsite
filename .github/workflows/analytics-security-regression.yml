name: Portfolio analytics security regression

on:
  pull_request:
    paths:
      - "cv/vercel.json"
      - "cv/analytics/**"
      - "cv/tests/analytics-security-headers.test.cjs"
      - ".github/workflows/analytics-security-regression.yml"
  push:
    branches:
      - main
      - security/cloudflare-audit-analytics-hardening
    paths:
      - "cv/vercel.json"
      - "cv/analytics/**"
      - "cv/tests/analytics-security-headers.test.cjs"
      - ".github/workflows/analytics-security-regression.yml"

permissions:
  contents: read

jobs:
  analytics-security:
    name: Audit private dashboard configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Run isolated source-only security regression
        run: node --test cv/tests/analytics-security-headers.test.cjs
